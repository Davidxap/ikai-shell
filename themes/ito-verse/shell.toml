# GENERATED by scripts/gen-palette.py from palette.toml - do not hand-edit.
# Ito-verse shell surfaces. Ink bar, bone text, blood actives.
#
# A theme that ships this file replaces the generated default outright, so every
# surface is declared here on purpose. Stops are assigned by contrast role; see
# palette.toml and run scripts/gen-palette.py --check to re-verify them.

[font]
base-size = 12

[spacing]
scale = 1.0
scale-with-font = true

[bar]
background       = "#0e0e11"
background-alpha = 1.0
text             = "#d6d3cb"
active           = "#c72f2d"
scale-with-font  = true
size-horizontal  = 36
size-vertical    = 30
icon-slot        = 30
icon-canvas      = 20
icon-font        = 14
status-slot      = 23

[hyprland]
# Declared literally rather than tracking the Hyprland gradient: the border is
# part of the theme's identity, not of the window manager's current accent.
active-border            = "#b72b2a"
active-border-foreground = "#b72b2a"

[controls]
# Buttons, dropdowns and tab strips. Idle chrome stays bone so controls read as
# structure; only the persistent selected state earns blood.
normal-color        = "#d6d3cb"
normal-fill-alpha   = 0.05
normal-border       = "#d6d3cb"
normal-border-width = 1
normal-border-alpha = 0.35

hover-cursor-color        = "#d6d3cb"
hover-cursor-fill-alpha   = 0.1
hover-cursor-border       = "#b72b2a"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#d6d3cb"
focus-fill-alpha   = 0.1
focus-border       = "#c72f2d"
focus-border-width = 1
focus-border-alpha = 0.75

selected-color        = "#d6d3cb"
selected-fill-alpha   = 0.22
selected-border       = "#b72b2a"
selected-border-width = 1
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.26
selection-fill-alpha = 0.38

[popups]
# Every bar flyout. Blood border is what ties the stock panels to the theme.
background       = "#0e0e11"
background-alpha = 1.0
text             = "#d6d3cb"
border           = "#b72b2a"
border-alpha     = 1.0
border-width     = 2

[tooltip]
# Tooltips are transient, so the border recedes to the deep stop.
background       = "#0a0a0c"
background-alpha = 0.97
text             = "#d6d3cb"
border           = "#3f0f0e"
border-alpha     = 1.0

[notifications]
# Notifications interrupt, so they take the focus stop and a heavier border.
background       = "#0e0e11"
background-alpha = 1.0
text             = "#d6d3cb"
border           = "#c72f2d"
border-alpha     = 1.0
border-width     = 2
countdown        = "#c72f2d"

[launcher]
background                = "#0e0e11"
background-alpha          = 0.96
text                      = "#d6d3cb"
border                    = "#b72b2a"
border-alpha              = 1.0
scrim                     = "#060607"
scrim-alpha               = 0.62
selected-background       = "#651817"
selected-background-alpha = 0.9
selected-text             = "#d6d3cb"
selected-border           = "#c72f2d"
selected-border-alpha     = 0.85

[menu]
# Clipboard and emoji pickers inherit these. Selected rows are filled with the
# paint stop because bone on paint measures 8.28:1 - the anchor color finally
# gets to be a background instead of pretending to be text.
background                = "#0e0e11"
background-alpha          = 1.0
text                      = "#d6d3cb"
border                    = "#b72b2a"
border-alpha              = 1.0
scrim                     = "#060607"
scrim-alpha               = 0.62
selected-background       = "#651817"
selected-background-alpha = 0.9
selected-text             = "#d6d3cb"
selected-border           = "#c72f2d"
selected-border-alpha     = 0.85

[polkit]
# Error text must stay readable under stress, so it takes the text stop.
background       = "#0e0e11"
background-alpha = 1.0
text             = "#d6d3cb"
text-error       = "#d95a59"
border           = "#b72b2a"
border-error     = "#c72f2d"
border-alpha     = 1.0
scrim            = "#060607"
scrim-alpha      = 0.62
accent           = "#b72b2a"

[lock]
background       = "#0e0e11"
background-alpha = 0.82
text             = "#d6d3cb"
placeholder      = "#8a8a86"
text-error       = "#d95a59"
border           = "#3f0f0e"
border-active    = "#b72b2a"
border-error     = "#c72f2d"
border-alpha     = 1.0
selection        = "#651817"
selection-alpha  = 0.55

[image-picker]
scrim                   = "#060607"
scrim-alpha             = 0.62
text                    = "#d6d3cb"
selected-border         = "#c72f2d"
selected-border-alpha   = 1.0
unselected-border       = "#d6d3cb"
unselected-border-alpha = 0.24
